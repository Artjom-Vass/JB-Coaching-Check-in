<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c12">
<title>JB Coaching · Coach Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0a0c12;
  --s1:     #11141f;
  --s2:     #171b28;
  --s3:     #1e2335;
  --border: #252b3d;
  --gold:   #f0b429;
  --gold2:  #ffd166;
  --green:  #2dd4a0;
  --red:    #e05c5c;
  --text:   #e8eaf2;
  --muted:  #5c6480;
  --label:  #8b93b5;
  --r:      12px;
  --font:   'Space Grotesk', sans-serif;
  --mono:   'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); min-height: 100vh;
  font-size: 15px; line-height: 1.5;
}

header {
  background: rgba(10,12,18,0.97);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(16px);
}
.logo { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
.logo-mark { background: var(--gold); color: #0a0c12; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; }
.coach-badge {
  font-family: var(--mono); font-size: 11px;
  background: rgba(240,180,41,0.1); border: 1px solid rgba(240,180,41,0.3);
  color: var(--gold); padding: 4px 10px; border-radius: 20px;
}

main { max-width: 680px; margin: 0 auto; padding: 28px 16px 80px; }

/* ── Section title ── */
.section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--muted);
  margin-bottom: 12px; margin-top: 28px;
  display: flex; align-items: center; gap: 10px;
}
.section-title:first-child { margin-top: 0; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── Settings panel ── */
.panel {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 20px; margin-bottom: 14px;
}
.panel-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
label { display: block; font-size: 12px; color: var(--label); margin-bottom: 5px; font-weight: 500; }
input[type="text"] {
  width: 100%; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; color: var(--text);
  font-family: var(--font); font-size: 14px; outline: none;
  transition: border-color 0.15s;
}
input:focus { border-color: var(--gold); }
input::placeholder { color: var(--muted); }

.info-text { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.4; }

/* ── Buttons ── */
.btn {
  padding: 10px 18px; border: none; border-radius: 8px;
  font-family: var(--font); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn-gold { background: var(--gold); color: #0a0c12; }
.btn-gold:hover { background: var(--gold2); }
.btn-outline {
  background: transparent; border: 1px solid var(--border);
  color: var(--label);
}
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }
.btn-red { background: rgba(224,92,92,0.1); border: 1px solid rgba(224,92,92,0.3); color: var(--red); }
.btn-red:hover { background: rgba(224,92,92,0.2); }
.btn-green { background: rgba(45,212,160,0.1); border: 1px solid rgba(45,212,160,0.3); color: var(--green); }
.btn-green:hover { background: rgba(45,212,160,0.2); }
.btn-sm { padding: 7px 12px; font-size: 12px; }

/* ── Add participant form ── */
.add-form {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 20px; margin-bottom: 14px;
}

/* ── Participant cards ── */
.participant-card {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 16px 18px;
  margin-bottom: 10px; transition: border-color 0.15s;
}
.participant-card:hover { border-color: var(--s3); }

.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.card-name { font-weight: 600; font-size: 16px; }
.card-actions { display: flex; gap: 8px; }

.card-id {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  background: var(--s2); padding: 4px 10px; border-radius: 6px;
  margin-bottom: 12px; word-break: break-all; line-height: 1.6;
}

.link-row {
  display: flex; align-items: center; gap: 8px;
}
.link-display {
  flex: 1; font-family: var(--mono); font-size: 11px;
  color: var(--label); background: var(--s2);
  border: 1px solid var(--border); border-radius: 7px;
  padding: 8px 11px; word-break: break-all; line-height: 1.5;
  cursor: pointer; transition: border-color 0.15s;
}
.link-display:hover { border-color: var(--gold); }

.copy-indicator {
  font-family: var(--mono); font-size: 10px;
  color: var(--green); opacity: 0;
  transition: opacity 0.3s; white-space: nowrap;
}
.copy-indicator.show { opacity: 1; }

/* ── App URL setting ── */
.app-url-display {
  font-family: var(--mono); font-size: 12px; color: var(--gold);
  background: rgba(240,180,41,0.06); border: 1px solid rgba(240,180,41,0.2);
  border-radius: 8px; padding: 10px 14px; margin-top: 8px;
  word-break: break-all;
}

/* ── Empty state ── */
.empty-participants {
  text-align: center; padding: 50px 20px;
  color: var(--muted); font-size: 14px;
}
.empty-participants .icon { font-size: 40px; margin-bottom: 12px; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--s2); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 18px;
  font-size: 13px; color: var(--text); z-index: 300;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(45,212,160,0.4); color: var(--green); }

/* ── Divider ── */
hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

@media (max-width: 480px) {
  .add-form-row { grid-template-columns: 1fr; }
  .panel-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-mark">JB</span>
    <span>Coaching · Coach Dashboard</span>
  </div>
  <span class="coach-badge">👤 Coach</span>
</header>

<main>

  <!-- Settings -->
  <div class="section-title">Instellingen</div>
  <div class="panel">
    <div class="panel-row">
      <div class="field">
        <label>App URL (GitHub Pages)</label>
        <input type="text" id="appUrl" placeholder="https://artjom-vass.github.io/JB-Coaching-Check-in">
        <p class="info-text">De URL waar de check-in app staat</p>
      </div>
      <div class="field">
        <label>Jouw naam (coach)</label>
        <input type="text" id="coachName" placeholder="JB Coaching">
      </div>
    </div>
    <button class="btn btn-gold" onclick="saveSettings()">💾 Opslaan</button>
    <div class="app-url-display" id="appUrlDisplay" style="display:none"></div>
  </div>

  <!-- Add participant -->
  <div class="section-title">Deelnemer toevoegen</div>
  <div class="add-form">
    <div class="field">
      <label>Naam deelnemer</label>
      <input type="text" id="newName" placeholder="bijv. Anna de Vries">
    </div>
    <div class="field">
      <label>Google Sheets URL of Spreadsheet ID</label>
      <input type="text" id="newSheetId" placeholder="https://docs.google.com/spreadsheets/d/..." oninput="previewExtractedId()">
      <div id="extractedIdPreview" style="display:none;margin-top:6px;">
        <span style="font-size:11px;color:var(--muted);">Herkend ID: </span>
        <span id="extractedIdValue" style="font-family:var(--mono);font-size:11px;color:var(--green)"></span>
      </div>
      <p class="info-text">Plak de volledige URL van het Google Sheet, of het ID direct</p>
    </div>
    <button class="btn btn-gold" onclick="addParticipant()" style="width:100%">+ Deelnemer toevoegen</button>
  </div>

  <!-- Participant list -->
  <div class="section-title">Deelnemers (<span id="participantCount">0</span>)</div>
  <div id="participantList"></div>

</main>

<div class="toast" id="toast"></div>

<script>
// ─── State ───────────────────────────────────────────────
let settings = { appUrl: '', coachName: '' };
let participants = [];

// ─── Init ─────────────────────────────────────────────────
function init() {
  const saved = JSON.parse(localStorage.getItem('jb_coach_settings') || '{}');
  settings = { ...settings, ...saved };
  document.getElementById('appUrl').value    = settings.appUrl || '';
  document.getElementById('coachName').value = settings.coachName || '';
  updateAppUrlDisplay();

  participants = JSON.parse(localStorage.getItem('jb_coach_participants') || '[]');
  renderParticipants();
}

// ─── Settings ─────────────────────────────────────────────
function saveSettings() {
  settings.appUrl    = document.getElementById('appUrl').value.trim().replace(/\/$/, '');
  settings.coachName = document.getElementById('coachName').value.trim();
  localStorage.setItem('jb_coach_settings', JSON.stringify(settings));
  updateAppUrlDisplay();
  showToast('✓ Instellingen opgeslagen');
  renderParticipants(); // refresh links
}

function updateAppUrlDisplay() {
  const el = document.getElementById('appUrlDisplay');
  if (settings.appUrl) {
    el.textContent = settings.appUrl + '?id=SPREADSHEET_ID';
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

// ─── Extract Sheet ID from URL or raw ID ─────────────────
function extractSheetId(input) {
  const trimmed = input.trim();
  // Try to extract from full Google Sheets URL
  const match = trimmed.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  if (match) return match[1];
  // Otherwise assume it's already a raw ID (no slashes, no spaces)
  if (/^[a-zA-Z0-9_-]+$/.test(trimmed)) return trimmed;
  return null;
}

function previewExtractedId() {
  const input   = document.getElementById('newSheetId').value;
  const preview = document.getElementById('extractedIdPreview');
  const val     = document.getElementById('extractedIdValue');
  const id      = extractSheetId(input);
  if (id && input.length > 10) {
    val.textContent = id;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

// ─── Participants ──────────────────────────────────────────
function addParticipant() {
  const name  = document.getElementById('newName').value.trim();
  const input = document.getElementById('newSheetId').value.trim();

  if (!name)  { showToast('⚠️ Vul een naam in'); return; }
  if (!input) { showToast('⚠️ Vul een URL of ID in'); return; }

  const sheetId = extractSheetId(input);
  if (!sheetId) { showToast('⚠️ Geen geldig Sheet ID gevonden in de URL'); return; }

  participants.push({ id: Date.now(), name, sheetId });
  save();
  renderParticipants();

  document.getElementById('newName').value    = '';
  document.getElementById('newSheetId').value = '';
  document.getElementById('extractedIdPreview').style.display = 'none';
  showToast('✓ ' + name + ' toegevoegd');
}

function removeParticipant(id) {
  if (!confirm('Deelnemer verwijderen?')) return;
  participants = participants.filter(p => p.id !== id);
  save();
  renderParticipants();
}

function save() {
  localStorage.setItem('jb_coach_participants', JSON.stringify(participants));
}

function getLink(sheetId) {
  const base = settings.appUrl || 'https://jouw-app-url.github.io/JB-Coaching-Check-in';
  return `${base}?id=${sheetId}`;
}

function copyLink(sheetId, indicatorId) {
  const link = getLink(sheetId);
  navigator.clipboard.writeText(link).then(() => {
    const el = document.getElementById(indicatorId);
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
    showToast('✓ Link gekopieerd!');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = link;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✓ Link gekopieerd!');
  });
}

function openApp(sheetId) {
  window.open(getLink(sheetId), '_blank');
}

function shareWhatsApp(name, sheetId) {
  const link = getLink(sheetId);
  const text = encodeURIComponent(
    `Hoi ${name}! 👋\n\nHier is jouw persoonlijke JB Coaching check-in link:\n\n${link}\n\nOpen deze link elke dag om je dagelijkse check-in in te vullen. 💪`
  );
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

function shareNative(name, sheetId) {
  const link = getLink(sheetId);
  const text = `Hoi ${name}! 👋\n\nHier is jouw persoonlijke JB Coaching check-in link:\n\n${link}\n\nOpen deze link elke dag om je dagelijkse check-in in te vullen. 💪`;

  if (navigator.share) {
    navigator.share({ title: 'JB Coaching Check-in link', text });
  } else {
    // Fallback: copy to clipboard
    navigator.clipboard.writeText(text).then(() => {
      showToast('✓ Bericht gekopieerd — plak het in WhatsApp!');
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('✓ Bericht gekopieerd!');
    });
  }
}

function renderParticipants() {
  const list  = document.getElementById('participantList');
  const count = document.getElementById('participantCount');
  count.textContent = participants.length;

  if (participants.length === 0) {
    list.innerHTML = `
      <div class="empty-participants">
        <div class="icon">👥</div>
        <div>Nog geen deelnemers toegevoegd.<br>Vul hierboven naam en Spreadsheet ID in.</div>
      </div>`;
    return;
  }

  list.innerHTML = participants.map(p => {
    const link        = getLink(p.sheetId);
    const indicatorId = `copied_${p.id}`;
    return `
      <div class="participant-card">
        <div class="card-header">
          <div class="card-name">👤 ${escHtml(p.name)}</div>
          <div class="card-actions">
            <button class="btn btn-sm btn-outline" onclick="openApp('${escHtml(p.sheetId)}')">🔗 Openen</button>
            <button class="btn btn-sm btn-green" onclick="shareWhatsApp('${escHtml(p.name)}','${escHtml(p.sheetId)}')">💬 WhatsApp</button>
            <button class="btn btn-sm btn-outline" onclick="shareNative('${escHtml(p.name)}','${escHtml(p.sheetId)}')">📤 Delen</button>
            <button class="btn btn-sm btn-red" onclick="removeParticipant(${p.id})">✕</button>
          </div>
        </div>

        <div class="card-id">Sheet ID: ${escHtml(p.sheetId)}</div>

        <div class="link-row">
          <div class="link-display" onclick="copyLink('${escHtml(p.sheetId)}','${indicatorId}')" title="Klik om te kopiëren">
            ${escHtml(link)}
          </div>
          <button class="btn btn-sm btn-outline" onclick="copyLink('${escHtml(p.sheetId)}','${indicatorId}')">📋</button>
          <span class="copy-indicator" id="${indicatorId}">✓ Gekopieerd!</span>
        </div>
      </div>`;
  }).join('');
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ─── Toast ────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast success show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── Start ────────────────────────────────────────────────
init();
</script>
</body>
</html>
